services:
  postgres:
    image: postgres:16
    container_name: ai_platform_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: data_engineer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_engineer -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


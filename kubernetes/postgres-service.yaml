# ============================================================
# Service Endpoints — PostgreSQL (Docker Compose → K8s)
# Pointe directement vers l'IP de l'hôte minikube
# Module 4 – Docker et Kubernetes
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ai-platform
spec:
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-service
  namespace: ai-platform
subsets:
  - addresses:
      - ip: 192.168.49.1
    ports:
      - port: 5432


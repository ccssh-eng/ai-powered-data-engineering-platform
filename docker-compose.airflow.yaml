
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.10
  user: "50000:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@host.docker.internal:5432/airflow"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - .:/opt/airflow/project 
  restart: unless-stopped

services:

  airflow-init:
    <<: *airflow-common
    profiles:
      - init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}"
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
      AIRFLOW_ADMIN_EMAIL: "${AIRFLOW_ADMIN_EMAIL}"
    mem_limit: 768m

  airflow-webserver:
    <<: *airflow-common
    container_name: ai_platform_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    mem_limit: 1024m           # était 768m
    cpus: 0.5

  airflow-scheduler:
    <<: *airflow-common
    container_name: ai_platform_airflow_scheduler
    command: scheduler
    mem_limit: 896m             # était 768m
    cpus: 1.0

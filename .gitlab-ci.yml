
# ============================================================
# GitLab CI/CD Pipeline — AI-Powered Data Engineering Platform
# Module 5 — CI/CD avec GitLab
# ============================================================

stages:
  - test
  - lint
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/customer-etl
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  PYTHON_VERSION: "3.10"

# ============================================================
# STAGE 1 — TEST
# ============================================================
test:
  stage: test
  image: python:3.10-slim
  before_script:
    - pip install --quiet -r requirements.txt
    - pip install --quiet pytest pytest-cov
  script:
    - pytest tests/test_transform.py tests/test_database.py -v --cov=. --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ============================================================
# STAGE 2 — LINT
# ============================================================
lint:
  stage: lint
  image: python:3.10-slim
  before_script:
    - pip install --quiet flake8
  script:
    - flake8 . --max-line-length=120 --exclude=.venv,__pycache__,.git,airflow/logs
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ============================================================
# STAGE 3 — BUILD (Docker image)
# ============================================================
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f docker/Dockerfile -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# STAGE 4 — DEPLOY via GitLab Agent
# ============================================================
deploy:
  stage: deploy
  image: alpine/k8s:1.28.3
  environment:
    name: production
  script:
    - kubectl config use-context ssh-group2/ai-powered-data-engineering-platform:minikube-agent
    - kubectl set image deployment/customer-etl customer-etl=$DOCKER_IMAGE:$DOCKER_TAG -n ai-platform
    - kubectl rollout status deployment/customer-etl -n ai-platform --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build


